<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a href="#" class="header__logo">Nexcent</a>

                <nav class="header__nav">
                    <ul class="header__list">   
                            <li class="header__item"><a href="#" class="header__link">Home</a></li>
                            <li class="header__item"><a href="#" class="header__link">Services</a></li>
                            <li class="header__item"><a href="#" class="header__link">Feature</a></li>
                            <li class="header__item"><a href="#" class="header__link">Product</a></li>
                            <li class="header__item"><a href="#" class="header__link">Testimonial</a></li>
                            <li class="header__item"><a href="#" class="header__link">FAQ</a></li>
                    </ul>
                </nav>
        
        
                <div class="header__actions">
                    <button class="button button--ghost button--medium">Login</button>
                    <button class="button button--primary button--medium">Sign up</button>
                </div>

            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero__inner">
                    <div class="hero__content">
                        <h1 class="hero__title">Lessons and insights <span class="hero__title-accent"> from 8 years</span></h1>
                        <p class="hero__description">Where to grow your business as a photographer: site or social media?</p>
                        <button class="button button--primary button--large">Register</button>
                    </div>
                   
                    <div class="hero__image-wrapper">
                        <img class="hero__image" src="images/Illustration.png" alt="Illustration">
                    </div>
                    
                </div>
            </div>
        </section>


        <section class="clients"></section>
        <section class="community"></section>
        <section class="feature"></section>
        <section class="stats"></section>
        <section class="testimonial"></section>
        <section class="blog"></section>
    </main>
   

</body>
</html>
